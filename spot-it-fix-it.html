<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot It, Fix It</title>

<style>
:root{
  /* BUS 1410 doodle template: off-white paper, navy ink, pink / yellow / green / blue stickers. One column, phone first. */
  --paper:#FAFAFA; --ink:#222F3F; --muted:#56606E;
  --pink:#F6497B; --yellow:#FFE599; --green:#B6D7A8; --blue:#A7D8E0; --pinksoft:#FBC2D3;
  --body:"Manjari","Segoe UI",system-ui,sans-serif; --hand:"Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4}
#deco{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
#app{position:relative;max-width:620px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:var(--body);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h3{font-weight:700}
p{margin:0}
button{font:inherit;color:var(--ink);cursor:pointer;background:#fff;border:2.5px solid var(--ink);border-radius:16px 18px 15px 19px;padding:.6em 1em}
button:hover{background:#fff8dc}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
button.go{background:var(--yellow);font-weight:700;font-size:21px;width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:.55em .7em;width:100%}
textarea{min-height:90px;resize:vertical}
label{font-weight:700}
.hand{font-family:var(--hand)}
.muted{color:var(--muted)} .small{font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-family:var(--hand);font-size:26px}
.brand span{color:var(--pink)}
.score{font-family:var(--hand);font-size:22px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 14px;font-variant-numeric:tabular-nums}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:22px 26px 20px 28px;padding:16px 18px}
.pill{align-self:flex-start;font-family:var(--hand);background:var(--yellow);padding:3px 14px;border-radius:999px;font-size:19px}
.levels{display:grid;gap:10px}
.lvl{display:flex;gap:14px;align-items:flex-start}
.lvl .n{flex:none;width:44px;height:44px;border:2.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:24px}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.timer{font-family:var(--hand);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer.late{color:#C2185B}
.statement{font-size:28px;line-height:1.25}
.src{font-family:var(--hand);font-size:19px;color:var(--muted)}
.opts{display:grid;gap:12px}
.crit{width:100%;text-align:left;font-weight:700;font-size:21px;display:flex;align-items:center;gap:12px;padding:15px 16px}
.crit .k{flex:none;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-weight:400;font-size:24px;background:#fff}
.crit.right{outline:5px solid var(--ink);outline-offset:3px}
.crit.dim{opacity:.4}
.fixopt{width:100%;text-align:left;font-size:19px;padding:14px 16px}
.fixopt.right{background:var(--green)} .fixopt.part{background:var(--yellow)} .fixopt.wrong{background:var(--pinksoft)}
.fixopt.dim{opacity:.6}
div.fixopt{border:2.5px solid var(--ink);border-radius:16px 18px 15px 19px;background:#fff}
div.fixopt.right{background:var(--green)} div.fixopt.part{background:var(--yellow)} div.fixopt.wrong{background:var(--pinksoft)}
.verdict{font-family:var(--hand);font-size:44px;line-height:1.05}
.streak{font-family:var(--hand);font-size:20px;color:var(--pink)}
.badge{text-align:center;border:3px solid var(--ink);border-radius:50% 46% 52% 48%;padding:28px 18px;background:var(--yellow)}
.badge .t{font-family:var(--hand);font-size:36px;line-height:1.1}
.results{font-variant-numeric:tabular-nums}
.results table{border-collapse:collapse;width:100%}
.results td{padding:7px 2px;border-bottom:1.5px dashed var(--ink);vertical-align:top}
.results td:last-child{text-align:right;font-weight:700}
.note{background:var(--pinksoft);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ================= content ================= */
const CRIT=[{n:"Planned obsolescence",c:"#F6497B"},{n:"Materialism",c:"#FFE599"},{n:"Cultural pollution",c:"#B6D7A8"},{n:"Harm to the environment",c:"#A7D8E0"}];
const KEY="ABCD";
const QS=[
 {t:"Products are “designed for the dump.”",s:"From the video",a:0,x:"Made to be thrown away quickly so we buy again."},
 {t:"After 9/11, people were told to go shopping.",s:"From the video",a:1,x:"Buying is treated as a way of life, even a duty."},
 {t:"Each of us is targeted with more than 3,000 ads a day.",s:"From the video",a:2,x:"A flood of ads fills our daily life."},
 {t:"Forests are cut down and land is mined to make more stuff.",s:"From the video",a:3,x:"Taking resources faster than the planet can replace them."},
 {t:"Last year’s shoes look “out” only because the heel style changed.",s:"From the video",a:0,x:"Changing styles so working products feel old. The video calls it perceived obsolescence; Kotler counts it as a form of planned obsolescence."},
 {t:"Toxic flame retardants end up in our pillows, and in our bodies.",s:"From the video",a:3,x:"Toxic chemicals from production harm people and the planet."},
 {t:"Your phone slows down right after the new model comes out.",s:"Real life",a:0,x:"Products that seem to age on purpose push us to upgrade."},
 {t:"Billboards cover almost every bridge on the Ring Road.",s:"Real life",a:2,x:"Ads crowd our shared spaces."},
 {t:"A White Friday ad says you deserve to treat yourself to more stuff.",s:"Real life",a:1,x:"Telling us that buying more will make us happier."},
 {t:"Old TVs and phones are burned, releasing toxic smoke.",s:"From the video",a:3,x:"Burning waste in incinerators releases toxics such as dioxin."},
 {t:"Your laptop can’t be upgraded, so when it gets slow you have to buy a whole new one.",s:"From the video",a:0,x:"Products designed so they can’t be updated push us to replace them."},
 {t:"We work longer hours to afford more things, then go shopping to relax.",s:"From the video",a:1,x:"The work, watch, spend treadmill: buying as a way of life."},
 {t:"Ads now appear on buses, in every app, and even inside elevators.",s:"Real life",a:2,x:"Ads crowd every space we use."},
 {t:"Mines and factories pollute the water of the communities living next to them.",s:"From the video",a:3,x:"Making stuff harms the land, water and people nearby."}
];
const NQ=10;
/* Every option sounds reasonable. best = real change, good for people, planet AND profit.
   half = a real step, but it misses the main problem or the business can't survive. trap = sounds green but changes nothing or makes people buy more. */
const CASES=[
 {n:"Weekly Wear",p:"Fast fashion: new styles every week, so last month’s clothes feel old.",ok:[0,1],f:[
  ["Four collections a year, clothes designed to last, and a paid repair-and-resale corner in stores","best","It tackles the real problem (clothes made to feel old fast) and still earns money from repairs and resale."],
  ["A “Conscious Collection” made with 30% recycled polyester, promoted in a big Instagram campaign","trap","Greenwashing: a small line gets big ads while 95% of the range and the weekly drops stay the same."],
  ["A 15% voucher for every bag of old clothes brought back, with the clothes sent for recycling","trap","Buy-more trap: the voucher only works on new clothes, so it pushes people to buy again."],
  ["Every item switched to organic cotton, with prices doubled to cover the higher cost","half","Better for the planet, but it doesn’t stop clothes feeling old fast, and most customers can’t pay double."]]},
 {n:"Nova Phones",p:"A new model every year, and old phones slow down after updates.",ok:[0],f:[
  ["Six years of updates that keep phones fast, plus paid battery swaps and a care plan","best","It fixes planned obsolescence head-on and creates new income from service instead of yearly upgrades."],
  ["A big trade-in discount every year so customers always get the newest model, with old phones recycled","trap","Buy-more trap: recycling sounds good, but the plan keeps the yearly upgrade cycle running."],
  ["Plastic-free packaging, and factories powered fully by solar energy from next year","half","A real gain for the planet, but it misses the main problem: phones that are made to feel old."],
  ["A new “Nova Green” model in recycled aluminium, with a tree planted for every phone sold","trap","Greenwashing: a new model plus trees for every sale still means more phones and more waste."]]},
 {n:"Clear Spring",p:"Bottled water in single-use plastic bottles, sold everywhere.",ok:[3],f:[
  ["Refill stations in universities and offices, a branded reusable bottle, and a small fee per refill","best","It cuts single-use plastic and keeps a business model: customers still pay Clear Spring for water."],
  ["New labels saying “100% recyclable” and “Save the planet”, plus recycling bins near shops","trap","Greenwashing: recyclable is not recycled. The video shows recycling alone can’t fix the waste."],
  ["Every bottle redesigned to use 30% less plastic, with the same price and taste","half","A real step, but every bottle is still used once and thrown away."],
  ["Discounted 24-packs made from recycled plastic, so families can stock up for the month","trap","Buy-more trap: discounts on bigger packs mean more bottles bought and thrown away."]]},
 {n:"ClickCart",p:"An online electronics store whose huge White Friday sale shouts “Buy now!”",ok:[1,2],f:[
  ["A White Friday trade-in week: old devices collected, refurbished ones sold with a warranty","best","It keeps the big sales week and the profit, but moves customers to reuse instead of “buy more now”."],
  ["A tree planted for every order during White Friday, shown live on a counter on the homepage","trap","Buy-more trap: more orders mean more trees, so the message is still “buy more”."],
  ["White Friday cancelled and all advertising stopped, to stop pushing people to buy","half","It ends the pressure to buy, but losing 25% of yearly sales could sink the business."],
  ["An “eco-friendly” filter on the website, with the countdown ads and daily emails kept","trap","Greenwashing: the “Buy now!” pressure and the flood of ads stay exactly the same."]]},
 {n:"Pod & Co.",p:"Coffee capsules: every cup leaves one piece of aluminium waste.",ok:[3],f:[
  ["Free collection of used capsules with the next delivery, melted down into new capsules","best","It closes the loop on the waste and keeps the capsule business and its customers."],
  ["An ad campaign explaining that aluminium is “infinitely recyclable”, with a recycling guide","trap","Greenwashing: true on paper, but a guide changes nothing, and most capsules are never recycled."],
  ["Compostable capsules, with “compostable” printed in big letters on every box","trap","Sounds great, but these only break down in industrial composting sites that most cities don’t have."],
  ["Capsules dropped completely, and only bags of coffee beans sold from now on","half","Good for the planet, but it throws away the product its customers actually want."]]},
 {n:"FunBox Toys",p:"Cheap toys in kids’ meals that break within a week.",ok:[0,3],f:[
  ["A sturdy collectible toy series that kids can trade with each other at the restaurant","best","Toys last, kids keep coming back to collect and swap, and there is far less waste."],
  ["Toys made from recycled plastic, with a new design every week to keep kids excited","trap","Buy-more trap: still a toy every week that breaks and gets thrown away, just in a greener material."],

];
const KIND={best:{pts:7,label:"Best fix",cls:"right"},half:{pts:3,label:"Half right",cls:"part"},trap:{pts:0,label:"Trap",cls:"wrong"}};
const QSEC=20, PTS_Q=2, PTS_CRIT=3;
const AUTO=NQ*PTS_Q+CASES.length*(PTS_CRIT+KIND.best.pts); /* 20 + 60 = 80 */
const TEACHER=20;

/* ================= state ================= */

function blank(){return{screen:"start",name:"",group:"",q:0,qOrd:null,aOrd:null,qAns:[],qPts:[],c:0,step:"crit",cCrit:[],cFix:[],ord:null,cOrd:null,own:{c:null,change:"",slogan:""},attempt:0,started:null,finished:null};}
let S=blank();
try{const r=lsGet(LS);if(r)S=Object.assign(blank(),JSON.parse(r));}catch(e){}
function save(){lsSet(LS,JSON.stringify(S));}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function total(){return S.qPts.reduce((a,b)=>a+(b||0),0)+S.cCrit.reduce((a,v,i)=>a+(v!=null&&CASES[i].ok.includes(v)?PTS_CRIT:0),0)+S.cFix.reduce((a,v,i)=>a+(v!=null?KIND[CASES[i].f[v][1]].pts:0),0);}
function shuffle(n){const a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const curQ=k=>QS[S.qOrd[k]];
const qRight=k=>S.qAns[k]!=null&&S.qAns[k]===curQ(k).a;
function streak(){let n=0;for(let i=S.qAns.length-1;i>=0;i--){if(qRight(i))n++;else break;}return n;}

/* ================= timer ================= */
let tStart=0,tIv=null;
function startTimer(){tStart=Date.now();clearInterval(tIv);tIv=setInterval(()=>{const left=QSEC-(Date.now()-tStart)/1000;const el=document.getElementById("tm");
  if(el){el.textContent=Math.max(0,Math.ceil(left));el.classList.toggle("late",left<=5);}
  const b=document.getElementById("tb");if(b)b.style.width=Math.max(0,left/QSEC*100)+"%";
  if(left<=0){clearInterval(tIv);answer(null);}},200);}
function answer(i){
  if(S.screen!=="q")return;clearInterval(tIv);
  const left=Math.max(0,QSEC-(Date.now()-tStart)/1000);
  const ok=i===curQ(S.q).a;S.qAns[S.q]=i;S.qPts[S.q]=ok?PTS_Q:0;
  S.screen="qfb";save();render();
}

/* ================= screens ================= */
const head=()=>`<div class="top"><div class="brand">Spot It, <span>Fix It</span></div>${S.screen!=="start"?`<div class="score" aria-label="Your points">${total()} / ${AUTO}</div>`:""}</div>`;
function crit(i,cls,act,pos){return `<button class="crit ${cls||""}" style="background:${CRIT[i].c}" ${act||""}><span class="k">${KEY[pos==null?i:pos]}</span><span>${CRIT[i].n}</span></button>`;}
function prog(done,of){return `<div class="bar" aria-hidden="true"><i style="width:${done/of*100}%"></i></div>`;}
function vStart(){
  return `<div class="stack"><span class="pill">BUS 1410 · Introduction to Marketing</span>
  <h1 style="font-size:40px">Spot It, Fix It</h1>
  <p>A game about <i>The Story of Stuff</i> and Chapter 3, marked out of 100. Play on your own. At the end you’ll get a results card to hand in.</p>
  <div class="card levels">
   <div class="lvl"><div class="n">1</div><div><h3>Spot it</h3><p class="small">10 statements, 20 seconds each, in a random order. Which criticism of marketing is it? 2 points each.</p></div></div>
   <div class="lvl"><div class="n">2</div><div><h3>Fix it</h3><p class="small">6 companies. Name the problem (3 points), then find the best fix among four (up to 7 points). Careful: every option sounds good.</p></div></div>
   <div class="lvl"><div class="n">3</div><div><h3>Your turn</h3><p class="small">Write your own fix and slogan. Your teacher grades it out of 20.</p></div></div>
  </div>
  <div class="stack" style="gap:8px"><label for="nm">Your full name</label><input type="text" id="nm" data-f="name" maxlength="60" value="${esc(S.name)}" autocomplete="name">
   <label for="gp">Student ID or section <span class="muted" style="font-weight:400">(optional)</span></label><input type="text" id="gp" data-f="group" maxlength="40" value="${esc(S.group)}"></div>
  <button class="go" data-act="begin" ${S.name.trim().length<3?"disabled":""}>Start the game</button></div>`;
}
function vLevel(n,title,text,btn,act){return `<div class="stack" style="text-align:center;padding-top:40px"><div class="hand" style="font-size:26px">Level ${n}</div><h1 style="font-size:46px">${title}</h1><p>${text}</p><button class="go" data-act="${act}">${btn}</button></div>`;}
function vQ(){
  const Q=curQ(S.q);const st=streak();const ao=S.aOrd[S.q];
  return `<div class="stack"><div class="row" style="justify-content:space-between"><span class="pill">Level 1 · ${S.q+1} of ${NQ}</span>${st>=2?`<span class="streak">Streak × ${st}</span>`:""}<span class="timer" id="tm">${QSEC}</span></div>
  <div class="bar" aria-hidden="true"><i id="tb" style="width:100%"></i></div>
  <p class="src">${esc(Q.s)}</p><h2 class="statement">${esc(Q.t)}</h2><p class="muted small">Which criticism of marketing is this?</p>
  <div class="opts">${ao.map((i,p)=>crit(i,"",`data-act="ans" data-i="${i}"`,p)).join("")}</div></div>`;
}
function vQfb(){
  const Q=curQ(S.q);const a=S.qAns[S.q];const ok=a===Q.a;const pts=S.qPts[S.q];const ao=S.aOrd[S.q];
  return `<div class="stack"><span class="pill">Level 1 · ${S.q+1} of ${NQ}</span>
  <div class="verdict">${ok?`Yes! +${pts}`:(a==null?"Time’s up!":"Not this one")}</div>
  <h2 class="statement" style="font-size:22px">${esc(Q.t)}</h2>
  <div class="opts">${ao.map((i,p)=>crit(i,i===Q.a?"right":"dim",'tabindex="-1" aria-disabled="true"',p)).join("")}</div>
  <div class="card"><b>${CRIT[Q.a].n}.</b> ${esc(Q.x)}</div>
  <button class="go" data-act="nextq">${S.q<NQ-1?"Next statement →":"Finish Level 1 →"}</button></div>`;
}
function vCase(){
  const C=CASES[S.c];const cv=S.cCrit[S.c];const fv=S.cFix[S.c];
  let body=`<div class="card"><p class="small muted">Company ${S.c+1} of ${CASES.length}</p><h3 style="font-size:26px">${esc(C.n)}</h3><p style="margin-top:4px">${esc(C.p)}</p></div>`;
  if(S.step==="crit"){
    body+=`<b>Step 1: Which criticism does this company show?</b><div class="opts">${S.cOrd[S.c].map((i,p)=>crit(i,"",`data-act="ccrit" data-i="${i}"`,p)).join("")}</div>`;
  }else if(S.step==="critfb"){
    const ok=C.ok.includes(cv);
    body+=`<div class="verdict" style="font-size:34px">${ok?`Right! +${PTS_CRIT}`:"Not quite +0"}</div>
     <p>${ok?"You named it.":`This company mostly shows <b>${C.ok.map(i=>CRIT[i].n).join("</b> or <b>")}</b>.`}</p>
     <button class="go" data-act="tofix">Step 2: pick the best fix →</button>`;
  }else if(S.step==="fix"){
    const ord=S.ord[S.c];
    body+=`<b>Step 2: Which fix is best for people, the planet <i>and</i> profit?</b><p class="small muted">Only one is the best fix. Some are traps: they sound green but change nothing, or make people buy more.</p><div class="opts">${ord.map(i=>`<button class="fixopt" data-act="cfix" data-i="${i}">${esc(C.f[i][0])}</button>`).join("")}</div>`;
  }else{
    const kind=C.f[fv][1];const ord=S.ord[S.c];
    body+=`<div class="verdict" style="font-size:34px">${kind==="best"?`Best fix! +${KIND.best.pts}`:kind==="half"?`Half right +${KIND.half.pts}`:"It’s a trap! +0"}</div>
     <div class="opts">${ord.map(i=>{const f=C.f[i];return `<div class="fixopt ${KIND[f[1]].cls} ${i===fv||f[1]==="best"?"":"dim"}"><p class="small"><b>${KIND[f[1]].label}${i===fv?" · your pick":""}</b></p><p>${esc(f[0])}</p><p class="small" style="margin-top:6px">${esc(f[2])}</p></div>`;}).join("")}</div>
     <button class="go" data-act="nextcase">${S.c<CASES.length-1?"Next company →":"Finish Level 2 →"}</button>`;
  }
  return `<div class="stack"><span class="pill">Level 2 · Fix it</span>${prog(S.c+(S.step==="fixfb"?1:0),CASES.length)}${body}</div>`;
}
function vOwn(){
  const o=S.own;const ready=o.c!=null&&o.change.trim().length>=10&&o.slogan.trim().length>=3;
  return `<div class="stack"><span class="pill">Level 3 · Your turn</span><h2 style="font-size:30px">Write your own fix</h2>
  <p class="small muted">Pick any company. Don’t copy the options from Level 2: make up your own idea.</p><div class="card small"><b>Graded out of 20:</b> tackles the company’s real problem (5) · a real change, not greenwashing or a buy-more trap (10) · a slogan that fits (5)</div>
  <div class="opts">${CASES.map((C,i)=>`<button class="fixopt ${o.c===i?"part":""}" data-act="ownc" data-i="${i}" aria-pressed="${o.c===i}"><b>${esc(C.n)}</b> · <span class="small">${esc(C.p)}</span></button>`).join("")}</div>
  <label for="chg">One change to the product or the promotion</label><textarea id="chg" data-own="change" maxlength="300">${esc(o.change)}</textarea>
  <label for="slg">A new slogan</label><input type="text" id="slg" data-own="slogan" maxlength="80" value="${esc(o.slogan)}">
  <button class="go" data-act="finish" id="finishBtn" ${ready?"":"disabled"}>See my results →</button></div>`;
}
function badge(t){const pct=t/AUTO;return pct>=.8?"Sustainable Marketer":pct>=.55?"Marketing Pro":"Rookie Marketer";}
function resultText(){
  const t=total();const l1=S.qAns.filter((a,i)=>qRight(i)).length;const l2c=S.cCrit.filter((v,i)=>CASES[i].ok.includes(v)).length;const l2f=S.cFix.filter((v,i)=>v!=null&&CASES[i].f[v][1]==="best").length;
  const d=new Date(S.finished||Date.now());
  return [`SPOT IT, FIX IT · BUS 1410`,`Name: ${S.name}`,S.group?`ID / section: ${S.group}`:null,`Finished: ${d.toLocaleString()}`,`Attempt: ${S.attempt}`,
   `Level 1 (Spot it): ${l1}/10 correct`,`Level 2 (Fix it): ${l2c}/6 problems named, ${l2f}/6 best fixes`,`Auto score (Levels 1–2): ${t} / ${AUTO}`,`Level 3 (teacher): ___ / ${TEACHER}`,`Final: ___ / 100`,
   `Level 3 company: ${CASES[S.own.c].n}`,`Level 3 change: ${S.own.change.trim()}`,`Level 3 slogan: ${S.own.slogan.trim()}`].filter(Boolean).join("\n");
}
function vResults(){
  const t=total();const l1=S.qAns.filter((a,i)=>qRight(i)).length;const l2c=S.cCrit.filter((v,i)=>CASES[i].ok.includes(v)).length;const l2f=S.cFix.filter((v,i)=>v!=null&&CASES[i].f[v][1]==="best").length;
  const d=new Date(S.finished);
  return `<div class="stack"><div class="badge"><p class="small">${esc(S.name)}</p><div class="t">${badge(t)}</div><p class="hand" style="font-size:30px;margin-top:6px">${t} / ${AUTO}</p><p class="small">Level 3 is marked by your teacher out of 20</p></div>
  <div class="card results"><h3 style="margin-bottom:6px">Results card</h3><table>
   <tr><td>Name</td><td>${esc(S.name)}</td></tr>${S.group?`<tr><td>ID / section</td><td>${esc(S.group)}</td></tr>`:""}
   <tr><td>Finished</td><td>${esc(d.toLocaleString())}</td></tr><tr><td>Attempt</td><td>${S.attempt}</td></tr>
   <tr><td>Level 1: right answers</td><td>${l1} / 10</td></tr><tr><td>Level 2: problems named</td><td>${l2c} / 6</td></tr><tr><td>Level 2: best fixes</td><td>${l2f} / 6</td></tr>
   <tr><td>Auto score (Levels 1–2)</td><td>${t} / ${AUTO}</td></tr><tr><td>Level 3 (teacher)</td><td>___ / ${TEACHER}</td></tr><tr><td>Final</td><td>___ / 100</td></tr></table>
   <div style="margin-top:12px"><p class="small muted">Level 3 · ${esc(CASES[S.own.c].n)}</p><p><b>Change:</b> ${esc(S.own.change)}</p><p class="hand" style="font-size:24px">“${esc(S.own.slogan)}”</p></div></div>
  <div class="note"><b>Hand it in:</b> take a screenshot of this card, or press Copy and paste the text where your teacher asked.</div>
  <button class="go" data-act="copy" id="copyBtn">Copy my results</button>
  <button data-act="again" id="againBtn" class="small">Play again (counts as a new attempt)</button></div>`;
}
function render(){
  const app=document.getElementById("app");
  const ae=document.activeElement,active=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")?ae.id:null;
  const keep=active?{v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const v={start:vStart,l1:()=>vLevel(1,"Spot it","10 statements. Tap the criticism of marketing each one shows. 20 seconds each, 2 points for every right answer.","I’m ready","goq"),
    q:vQ,qfb:vQfb,l2:()=>vLevel(2,"Fix it","Six companies. For each: name its problem (3 points), then pick the best fix out of four (7 points, or 3 if half right). Every option sounds good. Look for the one that fixes the real problem, is good for people and the planet, and still makes money.","Let’s fix them","goc"),
    c:vCase,l3:()=>vLevel(3,"Your turn","Choose one company and write your own fix and slogan. Your teacher grades it out of 20.","Write my fix","goown"),own:vOwn,res:vResults}[S.screen]||vStart;
  app.innerHTML=head()+v();
  if(active){const el=document.getElementById(active);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e);}catch(err){}}}
  if(S.screen==="q")startTimer();
  window.scrollTo(0,0);
}
document.addEventListener("input",e=>{
  const f=e.target.dataset.f;if(f){S[f]=e.target.value;save();const b=document.querySelector('[data-act="begin"]');if(b)b.disabled=S.name.trim().length<3;}
  const o=e.target.dataset.own;if(o){S.own[o]=e.target.value;save();const b=document.getElementById("finishBtn");if(b)b.disabled=!(S.own.c!=null&&S.own.change.trim().length>=10&&S.own.slogan.trim().length>=3);}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  switch(a){
    case "begin":S.attempt=(S.attempt||0)+1;S.started=Date.now();S.screen="l1";break;
    case "goq":S.q=0;S.qOrd=shuffle(QS.length).slice(0,NQ);S.aOrd=Array.from({length:NQ},()=>shuffle(4));S.qAns=[];S.qPts=[];S.screen="q";break;
    case "ans":answer(+b.dataset.i);return;
    case "nextq":if(S.q<NQ-1){S.q++;S.screen="q";}else S.screen="l2";break;
    case "goc":S.c=0;S.step="crit";S.screen="c";S.ord=CASES.map(C=>shuffle(C.f.length));S.cOrd=CASES.map(()=>shuffle(4));break;
    case "ccrit":S.cCrit[S.c]=+b.dataset.i;S.step="critfb";break;
    case "tofix":S.step="fix";break;
    case "cfix":S.cFix[S.c]=+b.dataset.i;S.step="fixfb";break;
    case "nextcase":if(S.c<CASES.length-1){S.c++;S.step="crit";}else S.screen="l3";break;
    case "goown":S.screen="own";break;
    case "ownc":S.own.c=+b.dataset.i;break;
    case "finish":S.finished=Date.now();S.screen="res";break;
    case "copy":{const txt=resultText();const done=()=>{b.textContent="Copied ✓";};
      try{navigator.clipboard.writeText(txt).then(done,()=>{b.textContent="Copy didn’t work: take a screenshot instead";});}catch(err){b.textContent="Copy didn’t work: take a screenshot instead";}
      return;}
    case "again":{const keepName=S.name,keepGroup=S.group,att=S.attempt;S=blank();S.name=keepName;S.group=keepGroup;S.attempt=att;break;}
  }
  save();render();
});
render();
</script>
</body>
</html>
